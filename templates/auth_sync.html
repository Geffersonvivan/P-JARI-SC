<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticando - P-JARI/SC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center">

    <div class="flex flex-col items-center">
        <!-- Spinner -->
        <svg class="animate-spin -ml-1 mr-3 h-10 w-10 text-blue-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <h2 class="text-xl font-semibold text-slate-800">Preparando seu ambiente...</h2>
        <p class="text-slate-500 text-sm mt-2">Sincronizando chave de segurança.</p>
    </div>

    <!-- Clerk JS Setup -->
    <script>
        window.clerkPublishableKey = "{{ CLERK_PUBLISHABLE_KEY }}";
    </script>
    <script
        async
        crossorigin="anonymous"
        data-clerk-publishable-key="{{ CLERK_PUBLISHABLE_KEY }}"
        src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
        type="text/javascript"
    ></script>

    <script type="module">
        import { ptBR } from 'https://cdn.jsdelivr.net/npm/@clerk/localizations/dist/pt-BR.mjs';

        window.addEventListener('load', async function () {
            await Clerk.load({ localization: ptBR });
            
            if (Clerk.user) {
                try {
                    const token = await Clerk.session.getToken();
                    if (token) {
                        // Força a escrita do Cookie
                        document.cookie = `__session=${token}; path=/; max-age=3600; SameSite=Lax; Secure`;
                    }
                } catch(e) {
                    console.error("Erro na sincronização de token", e);
                }
                // Redireciona para o APP já com o Cookie gravado!
                window.location.href = '/app/';
            } else {
                // Se o usuário cancelou o login e caiu aqui, volta pra Home
                window.location.href = '/';
            }
        });
    </script>
</body>
</html>
